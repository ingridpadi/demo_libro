<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azul Café - Landing Page</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- CONFIGURACIÓN DE FUENTES (Gandhi Sans Únicamente) --- */
        @font-face {
            font-family: 'GandhiSans';
            src: url('fonts/GandhiSans-Regular.woff2') format('woff2'),
                 url('fonts/GandhiSans-Regular.otf') format('opentype'),
                 url('GandhiSans-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'GandhiSans';
            src: url('fonts/GandhiSans-Bold.woff2') format('woff2'),
                 url('fonts/GandhiSans-Bold.otf') format('opentype'),
                 url('GandhiSans-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'GandhiSans';
            src: url('fonts/GandhiSans-Italic.woff2') format('woff2'),
                 url('fonts/GandhiSans-Italic.otf') format('opentype'),
                 url('GandhiSans-Italic.otf') format('opentype');
            font-weight: 400;
            font-style: italic;
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'GandhiSans', sans-serif;
            background-color: #051622;
            color: #ffffff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- JERARQUÍA DE IMPORTANCIA DE TIPOGRAFÍAS (SANS-SERIF) --- */
        
        /* 1. Máxima Prioridad: Títulos e Impacto (Gandhi Sans Bold + Tamaño Grande) */
        h1, h2, .who-title, .banner-text {
            font-family: 'GandhiSans', sans-serif;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        /* Subtítulos Destacados (Gandhi Sans Bold Mediano) */
        .sand-title-cursive {
            font-family: 'GandhiSans', sans-serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 2.5vw, 1.9rem);
            color: #1c446c;
            line-height: 1.4;
        }

        /* 2. Textos de Énfasis y Cierres Íntimos (Gandhi Sans Italic) */
        .dedication-text, em, .letter-card p:last-child {
            font-family: 'GandhiSans', sans-serif;
            font-style: italic;
            font-weight: 400;
        }

        /* 3. Estructuras de Interfaz / Micro-textos Fijos (Gandhi Sans Bold + Espaciado) */
        .hint-text, strong, .letter-header, .close-sand-btn {
            font-family: 'GandhiSans', sans-serif;
            font-weight: 700;
        }

        /* 4. Cuerpo de lectura Cómodo (Gandhi Sans Normal) */
        p, .sand-body-text, .letter-body-side p {
            font-family: 'GandhiSans', sans-serif;
            font-weight: 400;
            line-height: 1.65;
        }


        /* --- CONTENEDOR DESLIZABLE (SCROLL SNAP) --- */
        .main-slider {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .slide-section {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SLIDE 1: LOGO TOTALMENTE INTUITIVO COMO NAVEGADOR --- */
        .hero-video-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Logo configurado como botón dinámico */
        .logo-btn {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 800px;
            max-height: 75vh;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
            margin-bottom: 60px;
        }

        .logo-btn:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 15px 25px rgba(255,255,255,0.15));
        }

        .hint-text {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            animation: bounceIndicator 2s infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        @keyframes bounceIndicator {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -6px); }
            60% { transform: translate(-50%, -3px); }
        }


        /* --- SLIDE 2: ILUSTRACIÓN DE LA CITA + INTERFAZ ARENA --- */
        .quote-image-section {
            width: 100%;
            height: 100vh;
            background-color: #f9f1e7;
            position: relative;
        }

        .quote-img-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quote-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cafe-trigger-btn {
            position: absolute;
            top: 72%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 46px;
            height: 46px;
            background-color: #0c3156;
            color: #ffffff;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            z-index: 30;
            box-shadow: 0 0 15px rgba(12, 49, 86, 0.6);
            transition: all 0.3s ease;
        }

        .cafe-trigger-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #0c3156;
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
            top: 0;
            left: 0;
        }

        .cafe-trigger-btn:hover {
            transform: translate(-50%, -50%) scale(1.15);
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .sand-label-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 680px;
            background-color: #eedecb;
            background-image: radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 0);
            background-size: 8px 8px;
            color: #163a5f;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            text-align: center;
        }

        .sand-label-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .close-sand-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.6;
        }

        .sand-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 0 auto 25px auto;
            width: 60%;
            opacity: 0.7;
        }
        .sand-divider::before, .sand-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #163a5f;
        }

        .sand-body-text {
            font-size: clamp(1rem, 1.4vw, 1.15rem);
            margin-bottom: 20px;
        }

        .sand-icons-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 60px;
            opacity: 0.9;
            margin-top: 25px;
        }
        .sand-icon-item { display: flex; flex-direction: column; align-items: center; }
        .sand-icon-item i { font-size: 30px; }


        /* --- SLIDE 3: AUTORA + INTERACTIVIDAD SOBRE --- */
        .who-am-i-section {
            background-image: linear-gradient(rgba(5, 22, 34, 0.55), rgba(5, 22, 34, 0.4)), url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1800&q=80');
            background-size: cover;
            background-position: center;
            flex-direction: column;
            padding: 20px;
        }

        .who-title {
            font-size: clamp(1.8rem, 4.5vw, 3.2rem);
            margin-bottom: 30px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            transition: opacity 0.4s, transform 0.4s;
        }

        .interactive-envelope-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .envelope-button {
            background-color: #ffffff;
            width: 320px;
            height: 220px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
