<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azul Café - Landing Page</title>

    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #051622;
            color: #ffffff;
            overflow: hidden;
        }

        /* --- CONTENEDOR DESLIZABLE (SCROLL SNAP) --- */
        .main-slider {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory; /* Forzado estricto por sección de pantalla completa */
            scroll-behavior: smooth;
        }

        .slide-section {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start; /* Ajuste perfecto al borde superior de la pantalla */
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SLIDE 1: HERO (VIDEO + LOGO) --- */
        .hero-video-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay-image {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 135%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* --- SLIDE 2: IMAGEN DE LA CITA (PANTALLA COMPLETA) --- */
        .quote-image-section {
            background-color: #00121c; /* Fondo oscuro por si la proporción difiere ligeramente */
        }

        .quote-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Asegura que la imagen completa se visualice sin recortes */
        }

        /* --- SLIDE 3: ¿QUIÉN SOY? + INTERACTIVIDAD DE CARTA --- */
        .who-am-i-section {
            background-image: linear-gradient(rgba(5, 22, 34, 0.5), rgba(5, 22, 34, 0.3)), url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1800&q=80');
            background-size: cover;
            background-position: center;
            flex-direction: column;
            padding: 20px;
        }

        .who-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            margin-bottom: 30px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: opacity 0.4s, transform 0.4s;
        }

        /* Contenedor interactivo */
        .interactive-envelope-wrapper {
            position: relative;
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BOTÓN SOBRE (Vista Inicial) */
        .envelope-button {
            background-color: #ffffff;
            width: 320px;
            height: 220px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .envelope-button::after {
            content: '';
            position: absolute;
            top: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 100px solid rgba(0,0,0,0.06);
        }

        .envelope-button:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .heart-icon {
            color: #0b2230;
            font-size: 80px;
            z-index: 12;
            transition: transform 0.3s ease;
        }

        .envelope-button:hover .heart-icon {
            transform: scale(1.1);
        }

            border-radius: 4px;

            opacity: 0;
