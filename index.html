<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azul Café - Landing Page</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- TOP GALLERY GRID --- */
        .top-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            width: 100%;
            height: 25vh; /* Ocupa el 25% superior de la pantalla */
            min-height: 140px;
        }

        .gallery-item {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* Imágenes de la cuadrícula superior */
        .item-1 { background-image: url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=500&q=80'); } 
        .item-2 { background-image: url('https://images.unsplash.com/photo-1516414447565-b14be0adf13e?auto=format&fit=crop&w=500&q=80'); } 
        .item-3 { background-image: url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=80'); } 
        .item-4 { background-image: url('https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?auto=format&fit=crop&w=500&q=80'); } 

        /* --- HERO SECTION (MAIN) --- */
        .hero-section {
            flex: 1; /* Expande la sección para ocupar todo el alto restante de la pantalla */
            position: relative;
            width: 100%;
            background-image: url('Copia de Ingrid.PNG'); /* Tu imagen con el diseño completo integrado */
            background-size: cover;
            background-position: center;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
            .top-gallery {
                grid-template-columns: repeat(2, 1fr); /* Formato 2x2 en pantallas medianas/móviles */
                height: 30vh;
            }
        }

        @media (max-width: 480px) {
            .top-gallery {
                height: 20vh; /* Ajuste fino de proporción para celulares pequeños */
            }
        }
    </style>
</head>
<body>

    <header class="top-gallery">
        <div class="gallery-item item-1"></div>
        <div class="gallery-item item-2"></div>
        <div class="gallery-item item-3"></div>
        <div class="gallery-item item-4"></div>
    </header>

    <main class="hero-section"></main>

</body>
</html>
