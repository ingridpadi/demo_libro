<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azul Café - Landing Page</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #051622; color: #ffffff; overflow: hidden; }

        .main-slider { width: 100%; height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        .slide-section { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; }

        /* Estilo del Logo como botón */
        .logo-btn {
            position: relative;
            z-index: 10;
            width: 80%;
            max-width: 600px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .logo-btn:hover {
            transform: scale(1.08);
        }

        .hint-text {
            position: absolute;
            bottom: 40px;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 10px;
            opacity: 0.5;
            pointer-events: none;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        .bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    </style>
</head>
<body>

    <div class="main-slider" id="mainSlider">
        
        <section class="slide-section" id="slide1">
            <video class="bg-video" autoplay muted loop playsinline>
                <source src="PLAYA.mp4" type="video/mp4">
            </video>
            
            <img src="Copia de Ingrid.PNG" alt="azul Café" class="logo-btn" onclick="goNext()">
            
            <div class="hint-text">Presiona el logo para explorar</div>
        </section>

        <section class="slide-section" id="slide2" style="background: #f9f1e7; color: #051622;">
            <h2>Bienvenida al Slide 2</h2>
        </section>
        
        </div>

    <script>
        function goNext() {
            const slider = document.getElementById('mainSlider');
            const slides = document.querySelectorAll('.slide-section');
            const currentScroll = slider.scrollTop;
            const slideHeight = window.innerHeight;
            
            // Calcula cuál es el slide actual y salta al siguiente
            const nextIndex = Math.round(currentScroll / slideHeight) + 1;
            
            if (nextIndex < slides.length) {
                slides[nextIndex].scrollIntoView({ behavior: 'smooth' });
            } else {
                // Si llegas al final, vuelve al inicio
                slider.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
