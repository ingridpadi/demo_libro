<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azul Café - Portada Completa</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- CONFIGURACIÓN DE FUENTES (Gandhi Sans Únicamente) --- */
        @font-face {
            font-family: 'GandhiSans';
            src: url('fonts/GandhiSans-Regular.woff2') format('woff2'),
                 url('fonts/GandhiSans-Regular.otf') format('opentype'),
                 url('GandhiSans-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'GandhiSans';
            src: url('fonts/GandhiSans-Bold.woff2') format('woff2'),
                 url('fonts/GandhiSans-Bold.otf') format('opentype'),
                 url('GandhiSans-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'GandhiSans';
            src: url('fonts/GandhiSans-Italic.woff2') format('woff2'),
                 url('fonts/GandhiSans-Italic.otf') format('opentype'),
                 url('GandhiSans-Italic.otf') format('opentype');
            font-weight: 400;
            font-style: italic;
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden; /* Desactivamos el scroll para una experiencia de pantalla completa */
            background-color: #051622; /* Color de fondo de seguridad mientras carga */
            -webkit-font-smoothing: antialiased;
        }

        /* --- CONTENEDOR DE LA PORTADA A PANTALLA COMPLETA --- */
        .cover-container {
            width: 100%;
            height: 100vh; /* Altura de la vista del navegador completa */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* La imagen de portada configurada como fondo */
        .cover-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta la imagen para cubrir todo el contenedor sin deformarse */
            z-index: 1;
        }

        /* --- ELEMENTOS DE INTERFAZ UNIFICADOS (Gandhi Sans) --- */
        
        /* Título de Portada (Gandhi Sans Bold) */
        .cover-title {
            position: relative;
            z-index: 10;
            font-family: 'GandhiSans', sans-serif;
            font-weight: 700;
            color: #ffffff;
            font-size: clamp(2rem, 6vw, 4rem); /* Tamaño fluido y grande */
            text-align: center;
            width: 90%;
            max-width: 1000px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6); /* Sombra para legibilidad */
            pointer-events: none; /* El texto no interfiere con los clics */
            margin-bottom: 20px;
        }

        /* Hint Text (Gandhi Sans Bold + Mayúsculas) */
        .hint-text {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'GandhiSans', sans-serif;
            font-weight: 700;
            pointer-events: none;
            animation: bounceIndicator 2s infinite; /* Animación de rebote */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        @keyframes bounceIndicator {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -6px); }
            60% { transform: translate(-50%, -3px); }
        }

        /* --- DOCK REPRODUCTOR UNIFICADO --- */
        .audio-player-dock {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 30px;
            opacity: 0.75;
            transition: opacity 0.3s;
        }
        .audio-player-dock:hover { opacity: 1; }
        .audio-player-dock audio { display: block; height: 34px; width: 230px; }

        /* --- CONTROL DISPOSITIVOS MÓVILES --- */
        @media (max-width: 768px) {
            .cover-title { font-size: 1.8rem; }
            .hint-text { bottom: 35px; font-size: 10px; }
            .audio-player-dock { right: 50%; transform: translateX(50%); }
        }
    </style>
</head>
<body>

    <div class="audio-player-dock">
        <audio controls autoplay loop>
            <source src="Taylor Swift - Daylight (Official Audio).mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="cover-container">
        <img src="Portada.jpeg" alt="Portada de Azul Café a pantalla completa" class="cover-image">
        
        <h1 class="cover-title">Azul Café</h1>
        
        <div class="hint-text">
            <span>Explora</span>
            <i class="fa-solid fa-chevron-down"></i>
        </div>
    </div>

</body>
</html>
