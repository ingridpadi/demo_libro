<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azul Café - Landing Page</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            overflow: hidden; /* Evita scrolls innecesarios al no haber galería */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HERO SECTION WITH VIDEO BACKGROUND --- */
        .hero-video-section {
            position: relative;
            width: 100%;
            height: 100vh; /* Ahora ocupa el 100% de la pantalla al no tener la galería */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El video actúa como fondo cubriendo todo el espacio */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* --- IMAGEN SUPERPUESTA --- */
        .overlay-image {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 102%; 
            max-height: 96%; 
            object-fit: contain;
            pointer-events: none;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
            .overlay-image {
                max-width: 100%; 
            }
        }
    </style>
</head>
<body>

    <audio autoplay loop>
        <source src="videoplayback.m4a" type="audio/mp4">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <main class="hero-video-section">
        
        <video class="bg-video" autoplay muted loop playsinline>
            <source src="PLAYA.mp4" type="video/mp4">
        </video>

        <img src="Copia de Ingrid.PNG" alt="Branding Azul Café" class="overlay-image">

    </main>

</body>
</html>
