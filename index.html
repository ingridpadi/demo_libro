<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azul Café - Landing Page</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            overflow: hidden; /* Evita barras de scroll */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HERO SECTION WITH VIDEO BACKGROUND --- */
        .hero-video-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El video actúa como fondo cubriendo todo el espacio */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* --- IMAGEN SUPERPUESTA --- */
        .overlay-image {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 135%; 
            max-height: 100vh; 
            object-fit: contain;
            pointer-events: none;
        }

        /* --- MINI REPRODUCTOR INFERIOR --- */
        .audio-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10; /* Por encima del video y la imagen */
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px); /* Efecto esmerilado elegante */
            -webkit-backdrop-filter: blur(8px);
            padding: 6px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: opacity 0.3s ease;
            opacity: 0.75;
        }

        .audio-container:hover {
            opacity: 1; /* Se aclara por completo al pasar el cursor */
        }

        .audio-container audio {
            display: block;
            height: 36px; /* Altura compacta estilo mini */
            width: 240px; /* Ancho sutil */
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
            .overlay-image {
                max-width: 100%; 
            }
            .audio-container {
                right: 50%;
                transform: translateX(50%); /* Lo centra en pantallas móviles */
                bottom: 15px;
                width: calc(100% - 40px);
                max-width: 300px;
            }
            .audio-container audio {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main class="hero-video-section">
        
        <video class="bg-video" autoplay muted loop playsinline>
            <source src="PLAYA.mp4" type="video/mp4">
        </video>

        <img src="Copia de Ingrid.PNG" alt="Branding Azul Café" class="overlay-image">

        <div class="audio-container">
            <audio controls autoplay loop>
                <source src="Taylor Swift - Daylight (Official Audio).mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>

    </main>

</body>
</html>
